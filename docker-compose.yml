version: '3.8'

services:
  apis:
    build: .
    image: apis
    container_name: apis-container
    ports:
      - "7860:7860"
    env_file:
      - .env
    environment:
      - MONGO_HOST=mongodb
      - QDRANT_HOST=qdrant
      - MINIO_HOST=minio
    develop:
      watch:
        - path: .
          action: sync
          target: /app
    command: ["--reload"]

  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - mino-data:/data
    environment:
      MINIO_ROOT_USER: user
      MINIO_ROOT_PASSWORD: user_123123
    command: server --console-address ":9001" /data

  mongodb:
    image: mongodb/mongodb-community-server:latest
    container_name: mongodb-container
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-container
    ports:
      - "6333:6333"
      - "6334:6334" 
    volumes:
      - qdrant-storage:/qdrant/storage
    environment:
      QDRANT__HTTP__PORT: 6333
      QDRANT__GRPC__PORT: 6335

  ollama:
    image: ollama/ollama:latest
    ports:
      - 2462:11434
    container_name: ollama
    pull_policy: always
    tty: true
    restart: always
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0
    networks:
      - ollama-docker


  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - mynetwork

  zookeeper:
    image: wurstmeister/zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
  kafka:
    image: wurstmeister/kafka
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_HOST_NAME: localhost
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

  worker:
    build:
      context: ./celery_task
      dockerfile: Dockerfile
    container_name: worker
    env_file:
      - .env
    volumes:
      - ./celery_task:/app
    depends_on:
      - redis
      - kafka
    networks:
      - mynetwork

volumes:
  mongodb-data:
    driver: local
  qdrant-storage:
    driver: local
  mino-data:
    driver: local
 
networks:
  ollama-docker:
    external: false 
  mynetwork:
