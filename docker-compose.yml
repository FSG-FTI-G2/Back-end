version: '3.8'

services:
  apis:
    build: .
    image: apis
    container_name: apis-container
    ports:
      - "7860:7860"
    env_file:
      - .env
    environment:
      - MONGO_HOST=mongodb
      - QDRANT_HOST=qdrant
    develop:
      watch:
        - path: .
          action: sync
          target: /app
    command: ["--reload"]

  mongodb:
    image: mongodb/mongodb-community-server:latest
    container_name: mongodb-container
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-container
    ports:
      - "6333:6333"
      - "6334:6334" 
    volumes:
      - qdrant-storage:/qdrant/storage
    environment:
      QDRANT__HTTP__PORT: 6333
      QDRANT__GRPC__PORT: 6335

volumes:
  mongodb-data:
    driver: local
  qdrant-storage:
    driver: local
