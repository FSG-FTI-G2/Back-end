# Jenkins docker compose
volumes:
  jenkins_data:
    driver: local

services:
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    ports:
      - "8080:8080"
      - "50000:50000"
    restart: on-failure
    volumes:
      - jenkins_data:/var/jenkins_home


# docker compose -f .jenkins/docker-compose.yml up -d